<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Filtro de Corona AR</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <script>
    // 1. Componente para el primer FaceMesh (Oclusor invisible)
    AFRAME.registerComponent('occluder-material', {
        init: function () {
            this.el.addEventListener('model-loaded', () => {
                const mesh = this.el.getObject3D('mesh');
                if (mesh) {
                    mesh.traverse((node) => {
                        if (node.isMesh) {
                            node.material.colorWrite = false; // No pinta color, solo profundidad
                            node.material.depthWrite = true;  
                        }
                    });
                }
            });
        }
    });

    // 2. Componente para el segundo FaceMesh (Piel pálida)
    AFRAME.registerComponent('pale-skin', {
        init: function () {
            this.el.addEventListener('model-loaded', () => {
                const mesh = this.el.getObject3D('mesh');
                if (mesh) {
                    mesh.traverse((node) => {
                        if (node.isMesh) {
                            node.material.color.set('#e0e0e0'); // Tono blanco / gris pálido
                            node.material.roughness = 0.9;
                        }
                    });
                }
            });
        }
    });
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        .example-container { position: absolute; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="example-container">
        <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
            
            <a-assets>
                <a-asset-item id="crownModel" src="objects/crown_.glb"></a-asset-item>
                <a-asset-item id="espinaModel" src="objects/espina_.glb"></a-asset-item>
                <a-asset-item id="faceMeshModel" src="objects/faceMesh.glb"></a-asset-item>
            </a-assets>

            <a-camera active="true" position="0 0 0"></a-camera>

            <!-- Luces -->
            <a-light type="ambient" intensity="1.5"></a-light>
            <a-light type="directional" position="0 1 2" intensity="2"></a-light>

            <!-- Anclaje al rostro -->
            <a-entity mindar-face-target="anchorIndex: 10">
                
                <!-- 1. PRIMER FACEMESH (Oclusor invisible que recorta la corona) -->
                <a-gltf-model 
                    src="#faceMeshModel" 
                    position="0 -0.68 -0.1" 
                    rotation="0 180 0" 
                    scale="8.5 8.5 8.5"
                    occluder-material>
                </a-gltf-model>

                <!-- 2. La Corona de atrás -->
                <a-gltf-model 
                    src="#crownModel" 
                    position="0.0 -0.68 -0.3" 
                    rotation="0 180 0" 
                    scale="8.5 8.5 8.5">
                </a-gltf-model>

                <!-- 3. La parte delantera sobre la nariz (espina_.glb) -->
                <a-gltf-model 
                    src="#espinaModel" 
                    position="-0.0 -0.68 -0.1" 
                    rotation="0 180 0" 
                    scale="8.5 8.5 8.5">
                </a-gltf-model>

                <!-- 4. SEGUNDO FACEMESH DUPLICADO (Visible con color blanco pálido) -->
                <a-gltf-model 
                    src="#faceMeshModel" 
                    position="0 -0.68 -0.1" 
                    rotation="0 180 0" 
                    scale="8.5 8.5 8.5"
                    pale-skin>
                </a-gltf-model>

                <!-- 5. Ojo izquierdo negro -->
                <a-sphere 
                    position="0.03 0.05 -0.05" 
                    scale="0.012 0.012 0.012" 
                    material="color: #000000; roughness: 0.1">
                </a-sphere>

                <!-- 6. Ojo derecho negro -->
                <a-sphere 
                    position="-0.03 0.05 -0.05" 
                    scale="0.012 0.012 0.012" 
                    material="color: #000000; roughness: 0.1">
                </a-sphere>

            </a-entity>

        </a-scene>
    </div>

</body>
</html>
