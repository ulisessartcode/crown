<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corona 3D</title>
    <!-- Importar model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 100vw; height: 100vh; background-color: #1a1a1a; overflow: hidden; }
        model-viewer { 
            width: 100%; 
            height: 100%; 
        }
    </style>
</head>
<body>

    <model-viewer 
        src="objects/crown_.glb" 
        alt="Modelo 3D de Corona"
        auto-rotate 
        camera-controls 
        environment-image="neutral"
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
