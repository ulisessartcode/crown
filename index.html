<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Filtro de Corona AR</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        .example-container { position: absolute; width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="example-container">
        <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
            
            <a-assets>
                <a-asset-item id="crownModel" src="objects/crown_.glb"></a-asset-item>
                <!-- Añadimos el oclusor aquí -->
                <a-asset-item id="occluderModel" src="objects/head_occluder.glb"></a-asset-item>
            </a-assets>

            <a-camera active="true" position="0 0 0"></a-camera>

            <!-- Luces ambientales y direccionales -->
            <a-light type="ambient" intensity="1.5"></a-light>
            <a-light type="directional" position="0 1 2" intensity="2"></a-light>

<!-- Anclaje al rostro -->
            <a-entity mindar-face-target="anchorIndex: 10">
                
                <!-- 1. El Oclusor -->
                <a-gltf-model 
                    src="#occluderModel" 
                    position="0 -0.2 0" 
                    scale="0.065 0.065 0.065"
                    material="colorWrite: false">
                </a-gltf-model>

                <!-- 2. La Corona (Rotación corregida y bajada a su posición natural) -->
                <a-gltf-model 
                    src="#crownModel" 
                    position="0 -0.3 0.1" 
                    rotation="0 0 0" 
                    scale="8.5 8.5 8.5">
                </a-gltf-model>

            </a-entity>

            </a-entity>

        </a-scene>
    </div>

</body>
</html>
