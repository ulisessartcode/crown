<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebAR Face Filter</title>
    <!-- Incluir A-Frame y MindAR -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
</head>
<body>
    <a-scene mindar-face="imageTargetSrc: false; uiLoading: yes; uiError: yes; uiScanning: yes;" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true">
        <a-assets>
            <!-- Solo la corona por ahora -->
            <a-asset-item id="crownModel" src="objects/crown_.glb"></a-asset-item>
        </a-assets>

        <!-- Cámara de seguimiento facial de MindAR -->
        <a-camera active="false" position="0 0 0"></a-camera>

        <!-- Anclaje a la cabeza -->
        <a-entity mindar-face-target="anchorIndex: 10">
            <!-- Tu modelo de la corona -->
            <a-gltf-model 
                src="#crownModel" 
                position="0 -0.5 -0.1" 
                rotation="0 180 0" 
                scale="8.5 8.5 8.5">
            </a-gltf-model>
        </a-entity>
    </a-scene>
</body>
</html>
