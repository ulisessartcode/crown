<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo 3D - Corona</title>
    <script type="module" src="https://unpkg.com/@model-viewer/public@v3.4.0/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #111;
        }
        model-viewer {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- Ruta exacta ajustada -->
    <model-viewer 
        src="objects/crown_.glb" 
        alt="Modelo 3D de Corona" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
